name: Configuration check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-check:
    name: config-check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the validator
        run: python3 -m unittest -v
      - name: Validate proposed configuration
        run: python3 check_config.py
